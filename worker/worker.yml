# satnogs-worker configuration — installed to <local>/worker.yml by install.sh.
# Full reference: docs/worker-config.md. Relative paths are relative to this file.
#
# Per satellite (or under defaults:)
#   decoder:      auto | <gr-satellites name> | satyaml/X.yml | none
#   parser:       none | satnogs:<Class> | ksy/X.ksy | ksy/X.py[:Cls] | parsers/X.py[:func]
#   calib:        calib/X.yml          raw fields -> engineering units (points table)
#   mode:         cw | data            force how passes are processed (default: from flowgraph)
#   cw_fallback:  true                 data decode found nothing -> try CW
#   frame_prefix: "<hex>"              frames not starting with it are suspect
#   decoder_args: [..]                 extra gr-satellites arguments
#   sample_rate, always_decode, retention: { .. }

defaults:
  decoder: auto
  parser: none
  always_decode: false
  # IQ (.sigmf-data) retention in days after the observation, by outcome; "forever" keeps.
  # Metadata, database rows and frames are never deleted; iq/<obs>.keep pins a pass.
  # undecoded = bursts but no frames (no_decoder / no_frames / failed): kept longer so a
  # pass can be decoded once its satellite is identified or a decoder is written.
  # Per satellite: e.g.  41789: { ..., retention: { iq_days: 60 } }
  retention: { iq_days: 14, empty_days: 1, undecoded_days: 60, other_days: 7 }

satellites:
  98492: { decoder: satyaml/SPIRONE.yml, parser: "satnogs:Spirone" }
  # TEVEL2-1: gr-satellites knows it only by temporary ID 98647; SatNOGS now uses 63217
  98647: { decoder: TEVEL2-1, parser: "satnogs:Ax25frames" }
  63217: { decoder: TEVEL2-1, parser: "satnogs:Ax25frames" }
  # KOSEN-1: GMSK 9600 rarely heard, CW beacon often -> try CW when the data decode finds
  # nothing; CW beacon parsed and calibrated to engineering units
  49402: { cw_fallback: true, parser: parsers/kosen1_cw.py, calib: calib/kosen1.yml }
  # ALSAT-1N: not in gr-satellites; framing worked out from obs 15335933
  41789: { decoder: satyaml/ALSAT-1N.yml, parser: "satnogs:Alsat1n", frame_prefix: "414c314e00" }

settings:
  gr_satellites: gr_satellites
  decode_timeout_s: 1800
  pad_seconds: 3.0
  busy_seconds: 120          # defer while the client is writing an IQ dump
  burst_threshold_db: 3.0
  clock_min_db: 8.0          # symbol-clock line needed to measure a satellite's baud
  baud_search_frac: 0.02     # +-2 % around nominal baud
  baud_flag_ppm: 1000        # warn above this baud offset
  retention_auto: false      # true: each `run` deletes expired IQ. Check `satnogs-worker retention` first
  # Passes scheduled by other SatNOGS users (once the station is "available"): looked up
  # in the Network API before processing. delete = remove IQ + metadata (the client has
  # already uploaded everything to SatNOGS); keep = leave unprocessed (other_days
  # retention); process = treat like our own. [] turns the filter off.
  own_observers: [NewtMan]
  others: delete
